# ========================================
# CARISITE - nginx config
# Taruh file ini di: carisite/nginx.conf
# ========================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static pages and a real 404 for unknown routes.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Astro fingerprinted bundles can be cached indefinitely.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Editable, unhashed public assets must revalidate regularly.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|avif|webp)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}
